      <rect y="7" width="34" height="5" rx="2" fill="#2A2E45"/><rect y="7" width="10" height="5" rx="2" fill="#3E8EDE"/>
      <rect y="14" width="34" height="5" rx="2" fill="#2A2E45"/><rect y="14" width="18" height="5" rx="2" fill="#F0A73C"/>

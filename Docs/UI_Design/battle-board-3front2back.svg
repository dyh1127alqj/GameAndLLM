  <!-- ============ 图注 ============ -->
  <g fill="#5A6480" font-size="10">
    <text x="600" y="682" text-anchor="middle">
      圆圈=角色头像占位（可替换为 AI 生成立绘）｜圆环=ATB 行动条｜三色条=HP/Mana/Rage｜数字=飘字伤害示例｜左右各 3 前 2 后，后排嵌于前排空隙
    </text>
  </g>

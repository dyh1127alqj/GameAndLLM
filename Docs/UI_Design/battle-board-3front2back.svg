    <g transform="translate(-17,52)">
      <rect width="34" height="5" rx="2" fill="#2A2E45"/><rect width="24" height="5" rx="2" fill="#FF4D6D"/>
      <rect y="7" width="34" height="5" rx="2" fill="#2A2E45"/><rect y="7" width="18" height="5" rx="2" fill="#3E8EDE"/>
      <rect y="14" width="34" height="5" rx="2" fill="#2A2E45"/><rect y="14" width="22" height="5" rx="2" fill="#F0A73C"/>
    </g>
  </g>

  <!-- 敌·后排 E4（嵌在 E1/E2 空隙） -->
  <g transform="translate(920,297)">
    <circle r="30" fill="none" stroke="#28E0FF" stroke-width="3" stroke-dasharray="141 47" filter="url(#softGlow)"/>
    <circle r="24" fill="#1B2140" stroke="#FF6FC4" stroke-width="2"/>
    <path d="M-8,-4 L8,-4 L8,6 L-8,6 Z M-10,-4 L0,-14 L10,-4" fill="none" stroke="#FF6FC4" stroke-width="1.5"/>
    <text y="46" text-anchor="middle" fill="#8FA0C0" font-size="10">E4</text>
    <g transform="translate(-17,52)">
      <rect width="34" height="5" rx="2" fill="#2A2E45"/><rect width="22" height="5" rx="2" fill="#FF4D6D"/>
      <rect y="7" width="34" height="5" rx="2" fill="#2A2E45"/><rect y="7" width="16" height="5" rx="2" fill="#3E8EDE"/>
      <rect y="14" width="34" height="5" rx="2" fill="#2A2E45"/><rect y="14" width="26" height="5" rx="2" fill="#F0A73C"/>

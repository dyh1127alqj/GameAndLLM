    <circle r="30" fill="none" stroke="#C9A85C" stroke-width="3" stroke-dasharray="95 93" filter="url(#softGlow)"/>
    <circle r="24" fill="#1A2A20" stroke="#7FE0B8" stroke-width="2"/>

    <circle r="24" fill="#1B2140" stroke="#FF6FC4" stroke-width="2"/>
    <path d="M-8,-4 L8,-4 L8,6 L-8,6 Z M-10,-4 L0,-14 L10,-4" fill="none" stroke="#FF6FC4" stroke-width="1.5"/>
    <text y="46" text-anchor="middle" fill="#8FA0C0" font-size="10">E5</text>
    <g transform="translate(-17,52)">

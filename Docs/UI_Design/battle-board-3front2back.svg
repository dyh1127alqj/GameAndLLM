    <text y="-42" text-anchor="middle" fill="#FFD24D" font-size="11" font-weight="bold">98</text>
    <text y="48" text-anchor="middle" fill="#8FA0C0" font-size="10">E2</text>
    <g transform="translate(-17,54)">
      <rect width="34" height="5" rx="2" fill="#2A2E45"/><rect width="12" height="5" rx="2" fill="#FF4D6D"/>
      <rect y="7" width="34" height="5" rx="2" fill="#2A2E45"/><rect y="7" width="24" height="5" rx="2" fill="#3E8EDE"/>
      <rect y="14" width="34" height="5" rx="2" fill="#2A2E45"/><rect y="14" width="34" height="5" rx="2" fill="#F0A73C"/>
    </g>
  </g>


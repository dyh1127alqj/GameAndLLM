  <g transform="translate(460,375)">
    <circle r="30" fill="none" stroke="#C9A85C" stroke-width="3" stroke-dasharray="188 0" filter="url(#softGlow)"/>
    <circle r="24" fill="#1A2A20" stroke="#7FE0B8" stroke-width="2"/>
    <path d="M0,-14 L4,4 L-4,4 Z" fill="none" stroke="#7FE0B8" stroke-width="1.5"/>
    <text y="46" text-anchor="middle" fill="#8FA0C0" font-size="10">P2</text>
    <g transform="translate(-17,52)">
      <rect width="34" height="5" rx="2" fill="#20301F"/><rect width="34" height="5" rx="2" fill="#FF4D6D"/>
      <rect y="7" width="34" height="5" rx="2" fill="#20301F"/><rect y="7" width="30" height="5" rx="2" fill="#3E8EDE"/>
      <rect y="14" width="34" height="5" rx="2" fill="#20301F"/><rect y="14" width="34" height="5" rx="2" fill="#F0A73C"/>
